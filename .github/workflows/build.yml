name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the aarch64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build every userspace tool
        run: make tools

      - name: Assert every artefact is a static aarch64 binary
        run: |
          set -eu
          count=0
          for f in build/*; do
            file "$f" | grep -q 'ARM aarch64' || { echo "$f is not aarch64"; exit 1; }
            file "$f" | grep -q 'statically linked' || { echo "$f is not static"; exit 1; }
            count=$((count + 1))
          done
          echo "verified $count binaries"

      - name: Assert the shipped module keeps its identity
        run: |
          set -eu
          test -f src/prebuilt/myroot.ko
          sha256sum src/prebuilt/myroot.ko | awk '{print "module sha256: " $1}'
          strings -a src/prebuilt/myroot.ko | grep -q 'vermagic=3.10.33' \
            || { echo "module vermagic mismatch"; exit 1; }

      - name: Assert the hunter script parses
        run: bash -n src/tools/hunt2.sh && echo "hunt2.sh parses"

      - name: Assert the documents have balanced code fences
        run: |
          set -eu
          for f in docs/*.md README.md CONTRIBUTING.md; do
            n=$(grep -c '^```' "$f" || true)
            if [ $((n % 2)) -ne 0 ]; then echo "$f has an unclosed fence ($n)"; exit 1; fi
            echo "$f: $n fences"
          done
